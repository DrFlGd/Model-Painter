[package]
name = "model-painter"
version = "0.2.0"
description = "Paint 3D models for multi-colour printing, from their textures or by hand"
edition = "2021"
rust-version = "1.77"

[lib]
name = "model_painter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
